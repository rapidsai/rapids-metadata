name: checks
on:
  workflow_call:
    inputs:
      build_type:
        type: string
      publish:
        type: boolean
permissions: {}
jobs:
  check-style:
    runs-on: ubuntu-latest
    container:
      image: rapidsai/ci-conda:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check style
        run: "./ci/check_style.sh"
  build-conda:
    needs: check-style
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      script: "ci/build_python.sh"
      # Select only the build with the minimum Python version and the maximum CUDA version
      matrix_filter: '[map(select(.ARCH == "amd64")) | min_by((.PY_VER | split(".") | map(tonumber)), (.CUDA_VER | split(".") | map(-tonumber)))]'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  build-wheel:
    needs: check-style
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      script: "ci/build_wheel.sh"
      # Select only the build with the minimum Python version and the maximum CUDA version
      matrix_filter: '[map(select(.ARCH == "amd64")) | min_by((.PY_VER | split(".") | map(tonumber)), (.CUDA_VER | split(".") | map(-tonumber)))]'
      package-name: rapids-metadata
      package-type: python
      append-cuda-suffix: false
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  publish-wheels:
    needs:
      - build-wheel
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      package-name: rapids-metadata
      publish_to_pypi: true
    if: ${{ inputs.publish }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  publish-conda:
    needs:
      - build-conda
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
    if: ${{ inputs.publish }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
